# Install as ~/.codex/qwen.config.toml and start with: codex --profile qwen
model = "OpenVINO/Qwen3.6-35B-A3B-int4-ov"
model_provider = "qwen_openvino"
model_catalog_json = "/etc/codex/qwen-openvino-models.json"
model_reasoning_effort = "medium"
web_search = "disabled"

[model_providers.qwen_openvino]
name = "Qwen 3.6 OpenVINO"
base_url = "http://127.0.0.1:8011/v1"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false

[model_providers.qwen38_openvino]
name = "Qwen 3.8 OpenVINO Experimental"
base_url = "http://127.0.0.1:8011/v1"
wire_api = "responses"
requires_openai_auth = false
supports_websockets = false

# OVMS currently accepts function tools only. These Codex features can emit
# Responses namespace or hosted tools, which OVMS rejects before inference.
[features]
multi_agent = false
multi_agent_v2 = false
apps = false
plugins = false
tool_suggest = false
skill_search = false
image_generation = false
browser_use = false
computer_use = false
standalone_web_search = false
