keys:
  - &admin-kyle age12zyzprucuah6k35lhk2gk094jnhr6elyckfwnhgkc2hj5rajzays5qrnsz
  - &nixos-desktop age1dj4mg80gntpfue2ch2tdla4jzpe23d3qdc4lup3dtkr8r6a4lsms6zj6fc
  - &nixos-portable age1c4xdxn7eygr0zzek336tdgdmwrjk94cn8l2tlpae3h2fem3759tsdvlzjg
creation_rules:
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *nixos-desktop
      - *admin-kyle
      - *nixos-portable

# you can add a new machine via `nix-shell -p ssh-to-age --run "cat /etc/ssh/ssh_host_ed25519_key.pub | ssh-to-age"`
# after so, you can do `sops updatekeys secrets/*`
# you can allow `sops` commands on the new machine via moving ~/.config/sops/age/keys.txt to the new machine
# or add the new user via `age-keygen -o ~/.config/sops/age/keys.txt`
